name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4
  NODE_VERSION: 26

jobs:
  checks:
    name: Checks
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Audit dependencies
        run: bun audit --audit-level=high
      - name: Build the Linux binary, SBOM and checksums
        run: |
          bun run build:binaries -- --targets bun-linux-x64 --strict
          bun run sbom
          bun scripts/checksums.ts dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: The binary ignores .env and bunfig.toml in the working directory
        run: |
          dir=$(mktemp -d)
          printf 'CREW_DATA_DIR=%s/from-dotenv\n' "$dir" > "$dir/.env"
          (cd "$dir" && "$GITHUB_WORKSPACE/dist/crew-linux-x64" doctor --json > /dev/null || true)
          test ! -e "$dir/from-dotenv"
      - name: Install the npm tarballs and run crew
        run: |
          bun run build:npm
          prefix="$RUNNER_TEMP/npm-global"
          npm install --global --prefix "$prefix" ./dist-npm/crewyard-cli-linux-x64-*.tgz ./dist-npm/crewyard-[0-9]*.tgz
          "$prefix/bin/crew" version --json

  test-linux:
    name: Test (Linux)
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test

  test-macos:
    name: Test (macOS)
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test

  test-windows:
    name: Test (Windows)
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test
