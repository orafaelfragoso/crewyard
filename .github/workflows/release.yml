name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4
  NODE_VERSION: 26

jobs:
  release-please:
    name: Release PR and changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<< "$PR")
          if [ -z "$branch" ]; then
            echo "::warning::release-please reported a PR without a branch name; run CI on it manually."
            exit 0
          fi
          gh workflow run ci.yml --ref "$branch"

  build:
    name: Build release artifacts
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Tag matches package version
        if: needs.release-please.outputs.tag_name != ''
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: test "v$(jq -r .version package.json)" = "$TAG"
      - name: Cross-compile binaries
        run: bun run build:binaries -- --strict
      - name: Generate CycloneDX SBOM
        run: bun run sbom
      - name: Checksum every release asset
        run: bun scripts/checksums.ts dist
      - name: Pack npm packages
        run: bun run build:npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: |
            dist-npm/*.tgz
            dist-npm/packages.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify ${{ matrix.binary }}
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, binary: crew-linux-x64, npm: '@crewyard/cli-linux-x64' }
          - { os: ubuntu-24.04-arm, binary: crew-linux-arm64, npm: '@crewyard/cli-linux-arm64' }
          - { os: macos-15, binary: crew-darwin-arm64, npm: '@crewyard/cli-darwin-arm64' }
          - { os: macos-15-intel, binary: crew-darwin-x64, npm: '@crewyard/cli-darwin-x64' }
          - { os: windows-2025, binary: crew-windows-x64.exe, npm: '@crewyard/cli-win32-x64' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: npm
      - name: Verify checksum and run
        working-directory: dist
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          grep "  $BINARY\$" SHA256SUMS > one.sum
          if command -v sha256sum >/dev/null; then sha256sum -c one.sum; else shasum -a 256 -c one.sum; fi
          chmod +x "$BINARY"
          "./$BINARY" version --json
      - name: Install the npm tarballs and run crew
        working-directory: npm
        env:
          PLATFORM_PACKAGE: ${{ matrix.npm }}
        run: |
          tarball() { node -p "require('./packages.json').find((p) => p.name === process.argv[1]).tarball" "$1"; }
          prefix="$RUNNER_TEMP/npm-global"
          npm install --global --prefix "$prefix" "./$(tarball "$PLATFORM_PACKAGE")" "./$(tarball crewyard)"
          if [ "$RUNNER_OS" = Windows ]; then crew="$prefix/crew.cmd"; else crew="$prefix/bin/crew"; fi
          expected=$(node -p "require('./packages.json')[0].version")
          actual=$("$crew" version --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).data.version")
          test "$actual" = "$expected"

  github-release:
    name: Attach assets to the GitHub Release
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Build provenance for every checksummed asset
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: SBOM attestation for the binaries
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crew-*
          sbom-path: dist/sbom.cdx.json
      - name: Upload assets and installation notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ATTESTED: ${{ !github.event.repository.private }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          {
            gh release view "$TAG" --json body --jq .body
            echo
            echo "## Install"
            echo
            echo "\`npm install --global crewyard@${TAG#v}\` provides the \`crew\` command. Standalone binaries for each platform are attached below."
            echo
            if [ "$ATTESTED" = true ]; then
              echo "Verify downloads with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $GH_REPO\`."
            else
              echo "Verify downloads with \`sha256sum -c SHA256SUMS\`."
            fi
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  npm:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: npm
      - name: Require an npm CLI with trusted publishing
        run: |
          npm --version
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)"
      - name: Publish platform packages, then crewyard
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
          DRY_RUN: ${{ needs.release-please.outputs.release_created != 'true' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages.json')[0].version")
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          node -e "for (const p of require('./packages.json')) console.log(p.name, p.tarball)" | while read -r name tarball; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping."
            elif [ "$DRY_RUN" = true ]; then
              npm publish "./$tarball" --tag "$dist_tag" --dry-run
            else
              npm publish "./$tarball" --tag "$dist_tag"
            fi
          done

  npm-smoke:
    name: Install crewyard from npm
    needs: [release-please, npm]
    if: ${{ !cancelled() && needs.npm.result == 'success' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Wait until the registry serves the version
        run: |
          version="${TAG#v}"
          for attempt in $(seq 1 40); do
            if [ "$(npm view "crewyard@$version" version --prefer-online 2>/dev/null)" = "$version" ]; then exit 0; fi
            echo "Attempt $attempt: crewyard@$version is not served yet; retrying in 15 s."
            sleep 15
          done
          echo "::error::crewyard@$version did not appear on the registry within 10 minutes."
          exit 1
      - name: Install the published version and run crew
        run: |
          npm install --global --prefer-online "crewyard@${TAG#v}"
          actual=$(crew version --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).data.version")
          test "$actual" = "${TAG#v}"
